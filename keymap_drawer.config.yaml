# keymap-drawer v0.23.0 configuration.
# The workflow fetches ZMK modules from config/west.yml before parsing.
draw_config:
  n_columns: 2
  shrink_wide_legends: 8
  footer_text: "Generated from config/corne.keymap"
parse_config:
  zmk_additional_includes:
    - modules/zmk-helpers/include
  raw_binding_map:
    "&msc SCRL_LEFT": "Scroll ←"
    "&msc SCRL_DOWN": "Scroll ↓"
    "&msc SCRL_UP": "Scroll ↑"
    "&msc SCRL_RIGHT": "Scroll →"
    "&mmv MOVE_LEFT": "Pointer ←"
    "&mmv MOVE_DOWN": "Pointer ↓"
    "&mmv MOVE_UP": "Pointer ↑"
    "&mmv MOVE_RIGHT": "Pointer →"
    "&mkp MB1": "Left click"
    "&mkp MB2": "Right click"
    "&mkp MB3": "Middle click"
    "&mkp MB4": "Back"
    "&mkp MB5": "Forward"
    "&kp K_PREV": "Prev"
    "&kp K_VOLUME_DOWN": "Vol−"
    "&kp K_VOLUME_UP": "Vol+"
    "&kp K_NEXT": "Next"
    "&kp K_STOP": "Stop"
    "&kp K_PLAY_PAUSE": "Play/Pause"
    "&kp K_MUTE": "Mute"
    "&kp F13": "WEB"
    "&kp F14": "DEV"
    "&kp F15": "COMMS"
    "&kp F16": "RUN"
    "&kp F17": "AUX"
    "&kp LS(F13)": "Move→WEB"
    "&kp LS(F14)": "Move→DEV"
    "&kp LS(F15)": "Move→COMMS"
    "&kp LS(F16)": "Move→RUN"
    "&kp LS(F17)": "Move→AUX"
    "&kp LS(F18)": "Resize"
    "&kp F18": "Previous WS"
    "&kp F19": "Fullscreen"
    "&kp F20": "Float"
    "&kp LC(F13)": "Focus ←"
    "&kp LC(F14)": "Focus ↓"
    "&kp LC(F15)": "Focus ↑"
    "&kp LC(F16)": "Focus →"
    "&kp LC(LS(F13))": "Move ←"
    "&kp LC(LS(F14))": "Move ↓"
    "&kp LC(LS(F15))": "Move ↑"
    "&kp LC(LS(F16))": "Move →"
