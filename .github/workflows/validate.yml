name: Validate configuration & protocol

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "protocol/**"
      - "hosts/**"
      - "scripts/**"
      - "docs/**"
      - "build.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "config/**"
      - "protocol/**"
      - "hosts/**"
      - "scripts/**"
      - "docs/**"
      - "build.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/**"

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Corne Keymap Invariant Checks
        run: uv run scripts/check_corne_keymap.py

      - name: Run Sofle Keymap Invariant Checks
        run: uv run scripts/check_sofle_keymap.py

      - name: Run Build & Manifest Validation
        run: uv run scripts/check_build_config.py

      - name: Run Multi-Host Protocol Validation
        run: uv run scripts/check_host_protocol.py

      - name: Run Generated Artifact & Freshness Validation
        run: uv run scripts/check_generated.py
