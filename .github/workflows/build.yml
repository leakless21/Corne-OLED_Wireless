name: Build firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "dotfiles/**"
      - "scripts/**"
      - "build.yaml"
      - "boards/**"
      - "zephyr/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "config/**"
      - "dotfiles/**"
      - "scripts/**"
      - "build.yaml"
      - "boards/**"
      - "zephyr/**"
      - ".github/workflows/build.yml"
concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Run Keymap Invariant Checks
        run: python3 scripts/check_keymap.py
  validate-host-protocol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Run Host Protocol Validation
        run: python3 scripts/check_host_protocol.py
  build:
    needs: [validate-firmware, validate-host-protocol]
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@6e2ef41e022d555b10f116e395832913f71717b3
