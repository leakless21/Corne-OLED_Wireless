name: Build firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "boards/**"
      - "zephyr/**"
      - "build.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "config/**"
      - "boards/**"
      - "zephyr/**"
      - "build.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/build.yml"

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pre-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Keymap, Manifest & Protocol Invariant Checks
        run: |
          uv run scripts/check_corne_keymap.py
          uv run scripts/check_sofle_keymap.py
          uv run scripts/check_build_config.py
          uv run scripts/check_host_protocol.py
          uv run scripts/check_generated.py

  build:
    needs: validate-pre-build
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@6e2ef41e022d555b10f116e395832913f71717b3
