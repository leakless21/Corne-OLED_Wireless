name: Build firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "build.yaml"
      - "boards/**"
      - "zephyr/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "config/**"
      - "build.yaml"
      - "boards/**"
      - "zephyr/**"
      - ".github/workflows/build.yml"

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@6e2ef41e022d555b10f116e395832913f71717b3
