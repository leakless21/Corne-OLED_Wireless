name: Build firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "boards/**"
      - "zephyr/**"
      - "build.yaml"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "config/**"
      - "boards/**"
      - "zephyr/**"
      - "build.yaml"
      - ".github/workflows/build.yml"

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pre-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Validation Dependencies
        run: pip install --upgrade pyyaml tomli

      - name: Run Keymap, Manifest & Protocol Invariant Checks
        run: |
          python3 scripts/check_corne_keymap.py
          python3 scripts/check_sofle_keymap.py
          python3 scripts/check_build_config.py
          python3 scripts/check_host_protocol.py
          python3 scripts/check_generated.py

  build:
    needs: validate-pre-build
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@6e2ef41e022d555b10f116e395832913f71717b3
