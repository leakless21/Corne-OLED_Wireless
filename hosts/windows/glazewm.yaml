# Canonical GlazeWM configuration for the semantic keyboard protocol.
# Install this file at %USERPROFILE%/.glzr/glazewm/config.yaml; see docs/hosts/windows.md.

general:
  # Whether to automatically focus windows underlying the cursor.
  focus_follows_cursor: false

  # Whether to switch to the workspace of an active application when focusing it.
  cursor_follows_focus: false

gaps:
  inner_gap: 8px
  outer_gap: 8px

workspaces:
  - name: "1"
    display_name: "WEB"
  - name: "2"
    display_name: "DEV"
  - name: "3"
    display_name: "COMMS"
  - name: "4"
    display_name: "RUN"
  - name: "5"
    display_name: "AUX"

window_rules:
  # Auto-routing for hard-purpose applications
  - commands: ["set-floating"]
    match:
      - window_class: "Taskmgr"
      - window_class: "ControlPanel"

keybindings:
  # ===========================================================================
  # Workspace Switching (F13-F17) & Window Movement (Shift+F13-F17)
  # ===========================================================================
  - commands: ["focus --workspace 1"]
    bindings: ["f13", "alt+1"]
  - commands: ["focus --workspace 2"]
    bindings: ["f14", "alt+2"]
  - commands: ["focus --workspace 3"]
    bindings: ["f15", "alt+3"]
  - commands: ["focus --workspace 4"]
    bindings: ["f16", "alt+4"]
  - commands: ["focus --workspace 5"]
    bindings: ["f17", "alt+5"]

  - commands: ["move --workspace 1", "focus --workspace 1"]
    bindings: ["shift+f13", "alt+shift+1"]
  - commands: ["move --workspace 2", "focus --workspace 2"]
    bindings: ["shift+f14", "alt+shift+2"]
  - commands: ["move --workspace 3", "focus --workspace 3"]
    bindings: ["shift+f15", "alt+shift+3"]
  - commands: ["move --workspace 4", "focus --workspace 4"]
    bindings: ["shift+f16", "alt+shift+4"]
  - commands: ["move --workspace 5", "focus --workspace 5"]
    bindings: ["shift+f17", "alt+shift+5"]

  # ===========================================================================
  # Directional Navigation & Window Moving
  # ===========================================================================
  - commands: ["focus --direction left"]
    bindings: ["ctrl+f13", "alt+h"]
  - commands: ["focus --direction down"]
    bindings: ["ctrl+f14", "alt+j"]
  - commands: ["focus --direction up"]
    bindings: ["ctrl+f15", "alt+k"]
  - commands: ["focus --direction right"]
    bindings: ["ctrl+f16", "alt+l"]

  - commands: ["move --direction left"]
    bindings: ["ctrl+shift+f13", "alt+shift+h"]
  - commands: ["move --direction down"]
    bindings: ["ctrl+shift+f14", "alt+shift+j"]
  - commands: ["move --direction up"]
    bindings: ["ctrl+shift+f15", "alt+shift+k"]
  - commands: ["move --direction right"]
    bindings: ["ctrl+shift+f16", "alt+shift+l"]

  # ===========================================================================
  # Context, Modals & Window Controls
  # ===========================================================================
  # Previous workspace
  - commands: ["focus --recent-workspace"]
    bindings: ["f18", "alt+tab"]

  # Fullscreen toggle
  - commands: ["toggle-fullscreen"]
    bindings: ["f19", "alt+f"]

  # Float / Tile toggle
  - commands: ["toggle-floating --centered"]
    bindings: ["f20", "alt+shift+space"]

  # Enter Resize Mode
  - commands: ["wm-enable-binding-mode --name resize"]
    bindings: ["shift+f18", "alt+r"]

  # Enter Service Mode
  - commands: ["wm-enable-binding-mode --name service"]
    bindings: ["alt+f18", "alt+shift+semicolon"]

binding_modes:
  # ===========================================================================
  # Resize Mode
  # ===========================================================================
  - name: "resize"
    keybindings:
      - commands: ["resize --width -50px"]
        bindings: ["ctrl+f13", "alt+h", "h", "left"]
      - commands: ["resize --height +50px"]
        bindings: ["ctrl+f14", "alt+j", "j", "down"]
      - commands: ["resize --height -50px"]
        bindings: ["ctrl+f15", "alt+k", "k", "up"]
      - commands: ["resize --width +50px"]
        bindings: ["ctrl+f16", "alt+l", "l", "right"]
      - commands: ["wm-disable-binding-mode --name resize"]
        bindings: ["escape", "enter"]

  # ===========================================================================
  # Service Mode (WM Management & Monitor Movement)
  # ===========================================================================
  - name: "service"
    keybindings:
      - commands: ["move-workspace-to-monitor --direction prev", "wm-disable-binding-mode --name service"]
        bindings: ["ctrl+f13", "alt+h", "h", "left"]
      - commands: ["move-workspace-to-monitor --direction next", "wm-disable-binding-mode --name service"]
        bindings: ["ctrl+f16", "alt+l", "l", "right"]
      - commands: ["wm-reload-config", "wm-disable-binding-mode --name service"]
        bindings: ["f19", "r"]
      - commands: ["wm-redraw", "wm-disable-binding-mode --name service"]
        bindings: ["f20", "b"]
      - commands: ["wm-disable-binding-mode --name service"]
        bindings: ["escape", "enter"]
