# OLED Display configuration (zmk-nice-oled custom widgets)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Power and sleep policy (30s display blank, 15m deep sleep)
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_SLEEP=y

# ZMK Studio configuration
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y

# Mouse pointing support
CONFIG_ZMK_POINTING=y

# Rotary encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# External power policy: keep external power on even if RGB is disabled/toggled
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Windows-primary modifier widget style for nice-oled
CONFIG_NICE_OLED_WIDGET_MODIFIERS_WINDOWS=y
